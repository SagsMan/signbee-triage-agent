kind = "mobile"
previewPath = "/"
title = "SignBee Agent Mobile"
description = "An Expo mobile client for SignBee that guides people through interpreter booking requests, triage, matching, and status updates using the existing Python service boundary."
version = "1.0.0"
id = "artifacts/signbee-agent-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21803

[services.development]
run = "pnpm --filter @workspace/signbee-agent-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signbee-agent-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/signbee-agent-mobile", "run", "serve" ]

[services.env]
PORT = "21803"
BASE_PATH = "/"
